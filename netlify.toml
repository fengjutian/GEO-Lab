# Netlify 部署配置
#
# 产物结构（@astrojs/netlify）：
#   dist/                        预渲染的静态页面、_astro 资源、pagefind 索引、_redirects
#   .netlify/v1/functions/ssr/   /benchmark/* 与 /api/benchmark/* 的按需渲染 Function
#
# 之前站点整站 404 的原因：项目原先用的是 @astrojs/node standalone 适配器，
# 静态文件在 dist/client、服务端在 dist/server，而 Netlify 发布的是 dist/，
# 根目录没有 index.html，于是每个路径都落到 Netlify 的 404 页。

[build]
  command = "pnpm run build"
  publish = "dist"

[build.environment]
  # node:sqlite（可见性监测数据库）需要 Node >= 22.13，低于该版本模块仍在 --experimental-sqlite 后面。
  NODE_VERSION = "22"
  # 与 package.json 的 packageManager 对齐，避免 Netlify 用旧版 pnpm 读不懂 pnpm-workspace.yaml。
  PNPM_VERSION = "11.28.5"
  # 上线域名；换自定义域名时只改这一处，canonical / sitemap / JSON-LD 会一起跟随。
  SITE_URL = "https://geo-lab-site.netlify.app"

[dev]
  command = "pnpm run dev"
  framework = "#custom"
  targetPort = 4321

[[headers]]
  for = "/_astro/*"
  [headers.values]
    cache-control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    x-content-type-options = "nosniff"
    referrer-policy = "strict-origin-when-cross-origin"
